asyncapi: 2.6.0

info:
  title: Facility Layout Domain Events
  version: "1.0.0"
  description: >
    Domain-event catalog for the **facility-layout** bounded context, the
    system of record for where things physically are in the building: the
    site's structural hierarchy (Site, Area, Zone, Aisle) and the coded
    storage slots inside it. This context is a Generic Subdomain and an
    **Open Host Service** — these events ARE its Published Language, and
    every downstream service is a Conformist to them. Unlike a service that
    forwards a curated subset, this context's Kafka publisher
    (`internal/adapters/outbound/kafka/publisher.go`) emits **every** domain
    event to the integration topic — the whole Published Language.


    **Envelope: CloudEvents 1.0 (mandatory, ADR-0024).** Every message on
    this channel is a CloudEvents 1.0 event in **structured content mode**
    (CloudEvents Kafka protocol binding): the Kafka message value is the
    JSON event format and every message carries the Kafka header
    `content-type: application/cloudevents+json; charset=UTF-8`. All of
    `specversion` (`1.0`), `id` (UUID, minted once per domain event and
    stable across outbox redelivery), `source` (`/warehouse/facility-layout`),
    `type`, `subject` (the aggregate instance id), `time` (the domain
    occurred-at, UTC), `datacontenttype` (`application/json`) and
    `dataschema` (`urn:warehouse:facility-layout:events:<EventName>:v1`) are
    required. `data` carries the domain event's own JSON verbatim — note it
    also carries `eventName`, `eventType` and `occurredAt` fields, because
    the domain event's struct tags are the wire shape. There is no other
    envelope: consumers must reject (DLQ/skip) anything that fails
    CloudEvents validation.


    **The `type` attribute** follows the platform-wide reverse-DNS
    convention `com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>`
    — all lowercase except the final PascalCase event name, and the entity
    segment carries no hyphen even for multi-word aggregate names. This
    service's subdomain segment is `wms`: bin-accurate location is WMS-tier
    in the domain reference. Consumers dispatch on the FULL `type` string.
    Example: `com.warehouse.wms.facility-layout.locationslot.LocationSlotRegistered`.
    A breaking payload change is published as a new `.v2` type with a `:v2`
    dataschema, never by mutating an existing one.


    **Partitioning and ordering.** The Kafka message key is the identity of
    the aggregate that raised the event (site code, zone id, aisle id,
    location code, rule id, location type name), so all events for one
    aggregate land on the same partition and per-aggregate order is
    preserved. `FacilityLayoutImported` and the four ADR-0017 geometry /
    travel-graph events key on their event type (the publisher's
    `aggregateKey` fallback, unchanged by ADR-0024); their CloudEvents
    `subject` still names the aggregate instance.


    **Live consumer.** `inventory-storage` maintains a local read model of
    location classifications fed by this topic
    (`internal/adapters/outbound/facilitycache/`, selected with
    `LOCATION_LOOKUP_MODE=kafka`), replacing its per-stow synchronous
    `GET /locations/{locationCode}/classification` call. It consumes
    **ZoneRegistered**, **LocationSlotRegistered** and
    **LocationSlotDecommissioned**, replaying the topic from the first
    offset on every process start under a per-instance-unique consumer
    group, and gates its readiness on that replay completing. The remaining
    five messages are published but have no wired consumer today — they are
    Published Language available for future Conformists, stated so a
    downstream team cannot mistake an available event for a consumed one.
    See facility-layout ADR-0009 (integration publishing) and
    inventory-storage ADR-0013 (the location-classification cache).
  contact:
    name: Warehouse Systems Platform Team
    url: https://github.com/claudioed/facility-layout
    email: claudioed.oliveira@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: facility-layout
    description: >
      The facility-layout bounded context (wms subdomain) — the authoritative
      record of the warehouse's physical structure: sites, zones, aisles and
      coded location slots.
  - name: site
    description: >
      Events raised by the Site aggregate: a physical facility/building added
      to the warehouse map.
  - name: zone
    description: >
      Events raised by the Zone aggregate: a behavioral region inside a
      site's area, carrying temperature class and hazmat attributes.
  - name: aisle
    description: >
      Events raised by the Aisle aggregate: a physical corridor inside a
      zone, with walk-sequence and traversal direction.
  - name: locationtype
    description: >
      Events raised by the LocationType aggregate: a reusable slot
      shape/kind with weight and volume capacity.
  - name: placementrule
    description: >
      Events raised by the PlacementRule aggregate: a rule constraining
      which LocationTypes are legal in which Zones.
  - name: locationslot
    description: >
      Events raised by the LocationSlot aggregate: the coded leaf slots of
      the warehouse map — registration, decommissioning, and bulk import.
  - name: structure
    description: >
      Events raised by the FixedStructure aggregate (ADR-0017): site-scoped
      physical obstacles — walls, columns, offices, conveyors — drawn on
      the warehouse map. Not a location; nothing can be stowed at one.
  - name: crossaisle
    description: >
      Events raised by the CrossAisle aggregate (ADR-0017): zone-scoped
      connections between two aisles at a bay ordinal, the travel graph's
      cross-aisle edges.

servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: >
      The shared warehouse-systems Kafka broker (the in-cluster release,
      reachable from the host at `localhost:9092`), addressed via the
      `KAFKA_BROKERS` environment variable. The Kafka publisher is selected
      with `EVENT_PUBLISHER=kafka`; the default (unset) keeps the Postgres
      outbox / log publisher, so tests and local runs never need a broker.

defaultContentType: application/cloudevents+json

channels:
  warehouse.facility.events:
    description: >
      The single outbound integration topic for this bounded context, named
      after the `Topic` constant in
      `internal/adapters/outbound/kafka/publisher.go`
      (`warehouse.facility.events`). Every domain event this context raises
      is published here when `EVENT_PUBLISHER=kafka` — the whole Published
      Language, not a subset. The one live consumer today is
      inventory-storage's location-classification cache (ZoneRegistered,
      LocationSlotRegistered, LocationSlotDecommissioned); everything else
      is available, unconsumed Published Language.
    subscribe:
      operationId: onFacilityEvent
      summary: Consume facility-layout's Published Language.
      description: >
        Subscribe to every structural fact about the warehouse map. At-least-
        once delivery is the consumer's problem: deduplicate on the
        CloudEvents `id`,
        and expect to see the full history on a from-first-offset replay.
        A consumer building a local read model should follow the
        inventory-storage precedent: per-process-unique consumer group,
        FirstOffset replay, readiness gated on catching up to the high
        watermark observed at start.
      message:
        oneOf:
          - $ref: '#/components/messages/siteRegistered'
          - $ref: '#/components/messages/siteCapabilityChanged'
          - $ref: '#/components/messages/zoneRegistered'
          - $ref: '#/components/messages/aisleRegistered'
          - $ref: '#/components/messages/locationTypeRegistered'
          - $ref: '#/components/messages/placementRuleDefined'
          - $ref: '#/components/messages/locationSlotRegistered'
          - $ref: '#/components/messages/locationSlotDecommissioned'
          - $ref: '#/components/messages/facilityLayoutImported'
          - $ref: '#/components/messages/locationGeometryUpdated'
          - $ref: '#/components/messages/aisleGeometryUpdated'
          - $ref: '#/components/messages/fixedStructureRegistered'
          - $ref: '#/components/messages/crossAisleRegistered'

  warehouse.facility.analytics:
    description: >
      The analytics topic of this bounded context (ADR-0010), named after
      the `AnalyticsTopic` constant in
      `internal/adapters/outbound/kafka/analytics_publisher.go`
      (`warehouse.facility.analytics`). The composition root fans EVERY
      domain event out to it alongside the integration topic when
      `EVENT_PUBLISHER=kafka` and `analytics.enabled` — same CloudEvent
      `type` and `id` per occurrence, with
      `dataschema=urn:warehouse:facility-layout:analytics:<EventName>:v1`.
      It is NOT part of the cross-context integration contract: it exists
      so this service's own analytical read model (the "Layout Catalog
      Growth & Change" data product) can evolve independently of the OLTP
      Published Language. Cross-context consumers should subscribe to
      `warehouse.facility.events`, not here.
    subscribe:
      operationId: onFacilityAnalyticsEvent
      summary: Consume facility-layout's analytics stream (internal data product).
      description: >
        The only supported consumer is this service's own
        `cmd/facility-projector` (single writer of the analytical
        database, ADR-0010). It follows the same at-least-once discipline:
        per-process-unique consumer group, FirstOffset replay,
        idempotent projection keyed on the CloudEvent `id`, readiness
        gated on catching up to the high watermark observed at start.
      message:
        oneOf:
          - $ref: '#/components/messages/siteRegistered'
          - $ref: '#/components/messages/zoneRegistered'
          - $ref: '#/components/messages/aisleRegistered'
          - $ref: '#/components/messages/locationTypeRegistered'
          - $ref: '#/components/messages/placementRuleDefined'
          - $ref: '#/components/messages/locationSlotRegistered'
          - $ref: '#/components/messages/locationSlotDecommissioned'
          - $ref: '#/components/messages/facilityLayoutImported'
          - $ref: '#/components/messages/locationGeometryUpdated'
          - $ref: '#/components/messages/aisleGeometryUpdated'
          - $ref: '#/components/messages/fixedStructureRegistered'
          - $ref: '#/components/messages/crossAisleRegistered'

components:
  schemas:
    cloudEvent:
      type: object
      description: >
        CloudEvents 1.0 structured-mode envelope (ADR-0024). Every attribute
        below is REQUIRED in this fleet. `data` carries the domain event's
        own JSON verbatim.
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      additionalProperties: false
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          format: uuid
          description: >
            Minted once per domain event and persisted with the outbox row,
            so a redelivery carries the same id. `(source, id)` is the
            consumer idempotency key.
        source:
          type: string
          format: uri-reference
          const: /warehouse/facility-layout
        type:
          type: string
          description: >
            `com.warehouse.wms.facility-layout.<entity>.<EventName>`.
            Consumers dispatch on the full string.
        subject:
          type: string
          minLength: 1
          description: Id of the aggregate instance the event is about.
        time:
          type: string
          format: date-time
          description: When the domain fact occurred (not when it was published), UTC.
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
          format: uri
          description: >
            `urn:warehouse:facility-layout:events:<EventName>:v<N>` on this
            channel (`...:analytics:...` on warehouse.facility.analytics).
        data:
          type: object
          description: The domain event's own JSON payload.

    eventDataBase:
      type: object
      description: >
        Fields present in every event's `data` payload — the domain event
        base struct's own serialization.
      required: [eventName, eventType, occurredAt]
      properties:
        eventName:
          type: string
          description: The bare PascalCase event name.
        eventType:
          type: string
          description: Same reverse-DNS type as the CloudEvents `type` attribute.
        occurredAt:
          type: string
          format: date-time

    temperatureClass:
      type: string
      enum: [Ambient, Chilled, Frozen]
      description: What a physical zone can hold, thermally.

    direction:
      type: string
      enum: [OneWay, TwoWay]
      description: How an aisle may be traversed.

  messages:
    siteRegistered:
      name: SiteRegistered
      contentType: application/cloudevents+json
      title: Site registered
      tags: [{ name: site }]
      summary: A physical facility/building was added to the warehouse map.
      description: >
        Raised by `RegisterSite`. Kafka key: `siteCode`. No consumer wired
        today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.site.SiteRegistered
              dataschema:
                const: urn:warehouse:facility-layout:events:SiteRegistered:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [siteCode, siteName]
                    properties:
                      siteCode:
                        type: string
                        description: Uppercase alphanumeric, unique. e.g. `WH1`.
                      siteName:
                        type: string

    siteCapabilityChanged:
      name: SiteCapabilityChanged
      contentType: application/cloudevents+json
      title: Site capability changed
      tags: [{ name: site }]
      summary: A site's transfer capability state changed.
      description: >
        A complete, PII-free last-write-wins snapshot of site transfer
        capability. Kafka key and CloudEvents subject: `site_code`. Consumers
        compare `capability_revision` and retain the latest complete snapshot;
        they must not infer either capability from facility topology.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.site.SiteCapabilityChanged
              dataschema:
                const: urn:warehouse:facility-layout:events:SiteCapabilityChanged:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [site_code, transfer_origin_enabled, transfer_destination_enabled, capability_revision]
                    properties:
                      site_code:
                        type: string
                        description: Uppercase alphanumeric site identity; also the Kafka key and CloudEvents subject.
                      transfer_origin_enabled:
                        type: boolean
                      transfer_destination_enabled:
                        type: boolean
                      capability_revision:
                        type: integer
                        format: int64
                        description: Monotonically increasing revision for last-write-wins consumers.

    zoneRegistered:
      name: ZoneRegistered
      contentType: application/cloudevents+json
      title: Zone registered
      tags: [{ name: zone }]
      summary: A behavioral zone was added inside a Site's area.
      description: >
        Raised by `RegisterZone`. Kafka key: `zoneId`. **Consumed live** by
        inventory-storage's location-classification cache — the zone's
        `hazmat` and `temperatureClass` attributes are exactly what its
        StowStock placement check reads.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.zone.ZoneRegistered
              dataschema:
                const: urn:warehouse:facility-layout:events:ZoneRegistered:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [zoneId, siteCode, areaCode, zoneCode, temperatureClass, hazmat]
                    properties:
                      zoneId:
                        type: string
                      siteCode:
                        type: string
                      areaCode:
                        type: string
                      zoneCode:
                        type: string
                      temperatureClass:
                        $ref: '#/components/schemas/temperatureClass'
                      hazmat:
                        type: boolean

    aisleRegistered:
      name: AisleRegistered
      contentType: application/cloudevents+json
      title: Aisle registered
      tags: [{ name: aisle }]
      summary: A physical corridor was added inside a Zone.
      description: >
        Raised by `RegisterAisle`. Kafka key: `aisleId`. No consumer wired
        today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.aisle.AisleRegistered
              dataschema:
                const: urn:warehouse:facility-layout:events:AisleRegistered:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [aisleId, zoneId, aisleCode, sequenceHint, direction]
                    properties:
                      aisleId:
                        type: string
                      zoneId:
                        type: string
                      aisleCode:
                        type: string
                      sequenceHint:
                        type: integer
                        description: Walk-order position within the zone.
                      direction:
                        $ref: '#/components/schemas/direction'

    locationTypeRegistered:
      name: LocationTypeRegistered
      contentType: application/cloudevents+json
      title: Location type registered
      tags: [{ name: locationtype }]
      summary: A reusable slot shape/kind was defined.
      description: >
        Raised by `RegisterLocationType`. Kafka key: `locationType`. No
        consumer wired today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.locationtype.LocationTypeRegistered
              dataschema:
                const: urn:warehouse:facility-layout:events:LocationTypeRegistered:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [locationType, maxWeightKg, maxVolumeM3]
                    properties:
                      locationType:
                        type: string
                        description: e.g. `PalletRack`, `ShelfBin`.
                      role:
                        type: string
                        description: >
                          The LocationRole (ADR-0016): Storage, Dock, Yard,
                          WorkCenter, Drop, Staging, QC, Consolidation, or
                          Shipping. Added additively; absent on events
                          emitted before this field existed, which consumers
                          should treat as `Storage`.
                      maxWeightKg:
                        type: number
                        description: >
                          0/absent for a role that does not require
                          capacity (Dock, Yard, WorkCenter, QC, Shipping).
                      maxVolumeM3:
                        type: number

    placementRuleDefined:
      name: PlacementRuleDefined
      contentType: application/cloudevents+json
      title: Placement rule defined
      tags: [{ name: placementrule }]
      summary: >
        A rule constraining which LocationTypes are legal in which Zones was
        declared.
      description: >
        Raised by `DefinePlacementRule`. Kafka key: `ruleId`. No consumer
        wired today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.placementrule.PlacementRuleDefined
              dataschema:
                const: urn:warehouse:facility-layout:events:PlacementRuleDefined:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [ruleId, locationType, effect, predicate]
                    properties:
                      ruleId:
                        type: string
                      locationType:
                        type: string
                      effect:
                        type: string
                        description: Allow or deny.
                      predicate:
                        type: string
                        description: The zone-matching predicate expression.

    locationSlotRegistered:
      name: LocationSlotRegistered
      contentType: application/cloudevents+json
      title: Location slot registered
      tags: [{ name: locationslot }]
      summary: A coded leaf slot now exists on the warehouse map.
      description: >
        Raised by `RegisterLocationSlot`, and once per successful row of
        `ImportFacilityLayout`. Kafka key: `locationCode`. **Consumed live**
        by inventory-storage's location-classification cache, which joins
        the slot to its parent zone's attributes via `zoneId`.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.locationslot.LocationSlotRegistered
              dataschema:
                const: urn:warehouse:facility-layout:events:LocationSlotRegistered:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [locationCode, aisleId, zoneId, locationType, maxWeightKg, maxVolumeM3]
                    properties:
                      locationCode:
                        type: string
                        description: >
                          The full coded location, e.g.
                          `WH1-STOR-AMB-A07-03-02-B`.
                      aisleId:
                        type: string
                      zoneId:
                        type: string
                      locationType:
                        type: string
                      role:
                        type: string
                        description: >
                          The LocationRole (ADR-0016). Added additively;
                          absent on events emitted before this field
                          existed, which consumers should treat as
                          `Storage`.
                      dockFlow:
                        type: string
                        description: >
                          Inbound, Outbound, or Both. Present only when
                          role is Dock (ADR-0016).
                      activities:
                        type: array
                        items:
                          type: string
                        description: >
                          Pack, Sort, QC, VAS, Deconsolidate, Receive
                          and/or Kit. Present only when role is WorkCenter
                          (ADR-0016).
                      maxWeightKg:
                        type: number
                        description: >
                          0/absent for a role that does not require
                          capacity (Dock, Yard, WorkCenter, QC, Shipping).
                      maxVolumeM3:
                        type: number

    locationSlotDecommissioned:
      name: LocationSlotDecommissioned
      contentType: application/cloudevents+json
      title: Location slot decommissioned
      tags: [{ name: locationslot }]
      summary: A coded slot was permanently retired.
      description: >
        Raised by `DecommissionLocationSlot`. Kafka key: `locationCode`.
        **Consumed live** by inventory-storage's location-classification
        cache, which evicts the slot (its stow placement check then
        fails open for that location, by design). Decommissioning is
        irreversible — there is no compensating event.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.locationslot.LocationSlotDecommissioned
              dataschema:
                const: urn:warehouse:facility-layout:events:LocationSlotDecommissioned:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [locationCode]
                    properties:
                      locationCode:
                        type: string

    facilityLayoutImported:
      name: FacilityLayoutImported
      contentType: application/cloudevents+json
      title: Facility layout imported
      tags: [{ name: locationslot }]
      summary: A bulk layout import completed.
      description: >
        Raised once per `ImportFacilityLayout` call, summarising rows
        submitted/imported/rejected — in addition to, not instead of, the
        per-slot `LocationSlotRegistered` events for each successful row.
        Kafka key: the event type (no single aggregate identity);
        CloudEvents `subject`: the fixed batch identity `layout-import`. No
        consumer wired today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.locationslot.FacilityLayoutImported
              dataschema:
                const: urn:warehouse:facility-layout:events:FacilityLayoutImported:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [rowsSubmitted, slotsImported, rowsRejected]
                    properties:
                      rowsSubmitted:
                        type: integer
                      slotsImported:
                        type: integer
                      rowsRejected:
                        type: integer

    locationGeometryUpdated:
      name: LocationGeometryUpdated
      contentType: application/cloudevents+json
      title: Location geometry updated
      tags: [{ name: locationslot }]
      summary: A coded slot's physical position/footprint was set or changed.
      description: >
        Raised by `SetLocationGeometry` (ADR-0017). CloudEvents `subject`:
        `locationCode`. Kafka key: the event type (`aggregateKey` fallback).
        No consumer wired today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.locationslot.LocationGeometryUpdated
              dataschema:
                const: urn:warehouse:facility-layout:events:LocationGeometryUpdated:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [locationCode, xM, yM, zM, widthM, depthM, heightM]
                    properties:
                      locationCode:
                        type: string
                        description: >
                          The full coded location, e.g.
                          `WH1-STOR-AMB-A07-03-02-B`.
                      xM:
                        type: number
                        description: Position in the site's local coordinate frame, in metres.
                      yM:
                        type: number
                      zM:
                        type: number
                        description: Height above floor level, in metres. Never negative.
                      widthM:
                        type: number
                        description: Footprint extent, in metres. Always strictly positive.
                      depthM:
                        type: number
                      heightM:
                        type: number
                      pickSequence:
                        type: integer
                        description: >
                          Optional explicit pick-path override for this
                          slot. Absent when no override was given.

    aisleGeometryUpdated:
      name: AisleGeometryUpdated
      contentType: application/cloudevents+json
      title: Aisle geometry updated
      tags: [{ name: aisle }]
      summary: An aisle's travel centreline was set or changed.
      description: >
        Raised by `SetAisleGeometry` (ADR-0017): the straight-line path the
        travel graph uses as this aisle's walkable route. CloudEvents
        `subject`: `aisleId`. Kafka key: the event type (`aggregateKey`
        fallback). No consumer wired today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.aisle.AisleGeometryUpdated
              dataschema:
                const: urn:warehouse:facility-layout:events:AisleGeometryUpdated:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [aisleId, startXM, startYM, startZM, endXM, endYM, endZM, lengthM]
                    properties:
                      aisleId:
                        type: string
                        example: WH1-STOR-AMB-A07
                      startXM:
                        type: number
                      startYM:
                        type: number
                      startZM:
                        type: number
                      endXM:
                        type: number
                      endYM:
                        type: number
                      endZM:
                        type: number
                      lengthM:
                        type: number
                        description: The centreline's straight-line length, in metres.

    fixedStructureRegistered:
      name: FixedStructureRegistered
      contentType: application/cloudevents+json
      title: Fixed structure registered
      tags: [{ name: structure }]
      summary: A site-scoped physical obstacle was added to the warehouse map.
      description: >
        Raised by `RegisterFixedStructure` (ADR-0017): a wall, column,
        office, conveyor, or other fixed object. Not a location — nothing
        can be stowed at it. CloudEvents `subject`: `structureId`. Kafka
        key: the event type (`aggregateKey` fallback). No consumer wired
        today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.structure.FixedStructureRegistered
              dataschema:
                const: urn:warehouse:facility-layout:events:FixedStructureRegistered:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [structureId, siteCode, kind, xM, yM, zM, widthM, depthM, heightM, label]
                    properties:
                      structureId:
                        type: string
                        example: STR-1
                      siteCode:
                        type: string
                        example: WH1
                      kind:
                        type: string
                        description: Wall, Column, Office, Conveyor, or Other.
                      xM:
                        type: number
                        description: Footprint origin, in the site's local coordinate frame, in metres.
                      yM:
                        type: number
                      zM:
                        type: number
                      widthM:
                        type: number
                      depthM:
                        type: number
                      heightM:
                        type: number
                      label:
                        type: string
                        example: North wall

    crossAisleRegistered:
      name: CrossAisleRegistered
      contentType: application/cloudevents+json
      title: Cross-aisle registered
      tags: [{ name: crossaisle }]
      summary: A connection between two aisles was added to the travel graph.
      description: >
        Raised by `RegisterCrossAisle` (ADR-0017): a zone-scoped connection
        between two of its aisles at a bay ordinal, letting the travel
        graph route between aisles without walking to either end.
        CloudEvents `subject`: `<zoneId>/<fromAisle>-<toAisle>@<atBay>` (the
        cross-aisle's composite identity). Kafka key: the event type
        (`aggregateKey` fallback). No consumer wired today.
      payload:
        allOf:
          - $ref: '#/components/schemas/cloudEvent'
          - type: object
            properties:
              type:
                const: com.warehouse.wms.facility-layout.crossaisle.CrossAisleRegistered
              dataschema:
                const: urn:warehouse:facility-layout:events:CrossAisleRegistered:v1
              data:
                allOf:
                  - $ref: '#/components/schemas/eventDataBase'
                  - type: object
                    required: [zoneId, fromAisle, toAisle, atBay]
                    properties:
                      zoneId:
                        type: string
                        example: WH1-STOR-AMB
                      fromAisle:
                        type: string
                        example: A07
                      toAisle:
                        type: string
                        example: A08
                      atBay:
                        type: string
                        example: "02"
