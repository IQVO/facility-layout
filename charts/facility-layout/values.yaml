# Default values for facility-layout.

replicaCount: 1

image:
  repository: iqvo/facility-layout
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: facility-layout.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute, additive alongside ingress above. Disabled by
# default so existing Ingress-based releases are unaffected; set
# gatewayApi.enabled=true (and leave ingress.enabled=false) to route via a
# Gateway API implementation instead (e.g. Kong's Ingress Controller acting
# as an unmanaged GatewayClass). Mirrors the shape verified live in
# warehouse-infra's fulfillment-execution Gateway API pilot.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

# Kong plugins rendered by THIS chart (kong-plugins.yaml) and attached to
# every HTTPRoute above via the konghq.com/plugins annotation. Fleet
# decision 2026-10-13: Kong configuration belongs to the application
# charts, not warehouse-infra Terraform. Defaults off; warehouse-infra's
# values switch them on. NO auth plugin here, ever — the fleet's endpoints
# are unauthenticated and the gateway adds no authentication or
# authorization.
kongPlugins:
  cors:
    enabled: false
    # Exact browser origin, never "*" (endpoints are unauthenticated).
    origin: "http://localhost"
  prometheus:
    enabled: false
  opentelemetry:
    enabled: false
    # OTLP/HTTP traces endpoint of the fleet collector; needs Kong started
    # with KONG_TRACING_INSTRUMENTATIONS or the plugin exports zero spans.
    tracesEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-scalable
# workload type, following order-management's ADR-0026 reference (Phase 3
# scalability). Every block below defaults `enabled: false` so this PR
# cannot silently change production replica behaviour on merge. When a
# component's autoscaling.<x>.enabled=true, that Deployment's own
# replicaCount / analytics.<x>.replicaCount value is OMITTED from the
# rendered manifest (see each deployment template's `{{- if not
# .Values.autoscaling.<x>.enabled }}` guard) so the HPA controller is the
# SOLE owner of .spec.replicas — a hardcoded `replicas:` field competing
# with the HPA would otherwise fight it on every reconcile.
#
# mcp deliberately has NO block here (skipped, not just disabled): its
# StreamableHTTPHandler (github.com/modelcontextprotocol/go-sdk/mcp,
# internal/adapters/inbound/mcp/server.go) keeps per-process, in-memory
# session state keyed by the MCP protocol's own Mcp-Session-Id header — a
# real multi-request session, not just a TCP/HTTP connection.
# charts/facility-layout/templates/mcp-service.yaml is a plain ClusterIP
# Service with no sessionAffinity configured, so a second replica could
# receive a mid-session request (e.g. tools/call following an earlier
# initialize) that its own process never created. This is the identical
# risk order-management's ADR-0026 documented for its own mcp Deployment;
# see mcp: below for the un-autoscaled replicaCount and ADR-0022 for the
# full reasoning.
autoscaling:
  # cmd/facility (this Deployment): stateless OLTP HTTP service. Unlike
  # order-management's api, cmd/facility has NO inbound Kafka consumer at
  # all (verified in cmd/facility/main.go — this service is purely an
  # outbound Kafka publisher, an Open Host Service with no consumer-group
  # membership to reason about), so there is no consumer-group-collision
  # class of risk to assess here — it is unconditionally safe to run N
  # independent copies of. max 4 / target 70% CPU per the plan.
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/facility-projector: ANALYTICS_CONSUMER_GROUP (analytics.projector.
  # consumerGroup, default "facility-analytics") is a STABLE, shared
  # consumer-group name with no
  # per-instance uniqueness -- the fleet's correctly-scalable pattern (N
  # replicas share partitions via normal Kafka group rebalancing), verified
  # from the actual consumer code before enabling this. Every projection
  # write is idempotent on the CloudEvents id (stored in the event_id
  # column) via ConsumedEventsRepo.MarkProcessed
  # (ON CONFLICT DO NOTHING), so correctness does not regress at N>1.
  # Capped at 2, not left at api's 4, mirroring order-management's
  # reasoning: this is a lightweight idempotent-upsert workload where a
  # wide fan-out buys little extra throughput.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # cmd/facility-reports: stateless read-only REST reader over its own
  # read-only pgxpool (analyticsstore.NewReadOnlyPool) -- no in-memory
  # state, no Kafka consumption. Same treatment as api.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built SPA bundle): pure
  # static-asset serving, no server-side session or per-request state
  # whatsoever -- the most trivially horizontally scalable workload in
  # this chart.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# Postgres and Kafka are the ONLY runtime (ADR 0039): there is no in-memory
# mode and no log sink. database.url or database.existingSecret (DATABASE_URL)
# and kafka.brokers (KAFKA_BROKERS) are mandatory -- the chart refuses to
# render without them, and the binaries exit at boot naming the variable.
# migrationsPath is resolved inside the image, where the Dockerfile copies
# /migrations next to the binary.
#
# Every key below is rendered into templates/configmap.yaml and reaches
# cmd/facility through the api Deployment's `envFrom: configMapRef` (gap fix
# D14); explicit env/extraEnv entries win for the same key.
config:
  httpAddr: ":8080"
  migrationsPath: "migrations"
  # The only publisher is "kafka" (ADR 0039): events are written through the
  # Postgres transactional outbox (ADR-0018) and relayed to the integration
  # topic AND the analytics topic the projector consumes. The key is kept
  # because warehouse-infra sets it; "log" (the retired log-only sink) is
  # refused at render time and by the binary at boot.
  eventPublisher: "kafka"
  # How long the outbox relay sleeps between empty passes (ADR-0018). The
  # relay always runs; rendered into the ConfigMap as OUTBOX_RELAY_INTERVAL.
  outboxRelayInterval: "1s"
  # Outbox relay attempt cap (ADR-0036); rendered as OUTBOX_MAX_ATTEMPTS. A
  # row that has failed this many sends is excluded from the relay's claims
  # and logged at ERROR; it stays in outbox_events until an operator re-arms
  # it (UPDATE outbox_events SET attempts = 0 WHERE id = ...). Later rows,
  # including rows with the same key, overtake it. 0 = unlimited (one poison
  # row blocks the relay forever).
  outboxMaxAttempts: 20
  # Housekeeping sweeper (ADR-0026): bounds the two append-only tables.
  # Rendered as HOUSEKEEPING_INTERVAL / IDEMPOTENCY_KEY_TTL /
  # OUTBOX_RETENTION. "0s" disables the respective knob (the whole
  # sweeper for the interval, one half for a TTL/retention).
  housekeepingInterval: "1h"
  idempotencyKeyTTL: "24h"
  outboxRetention: "168h"
  # Site capability heartbeat (ADR 0041): how often the CURRENT
  # SiteCapabilityChanged of every site with a declared transfer capability is
  # re-published (fresh time, revision + 1) so network-inventory-planning's
  # 10 minute freshness window holds while nothing changes. Keep it at or
  # below half of that window. Rendered as SITE_CAPABILITY_HEARTBEAT_INTERVAL;
  # "0s" disables the heartbeat.
  siteCapabilityHeartbeatInterval: "5m"

# OpenTelemetry. The service pushes traces, metrics and logs over OTLP/gRPC
# to a Collector; nothing is scraped from the pod. A Collector that is down
# or absent is harmless — the exporters are non-blocking and telemetry is
# simply dropped — so this can stay enabled in every environment.
otel:
  enabled: true
  # Either "host:port" or a full URL; the service accepts both. The URL
  # form is what the OTel SDK's own env-var convention expects.
  endpoint: "http://otel-collector.observability.svc.cluster.local:4317"
  serviceName: "facility-layout"

# Reported as the deployment.environment.name resource attribute on every
# span, metric and log record, so one Collector can serve several
# environments without them being confused for each other.
environment: "local"

database:
  # MANDATORY (ADR 0039): set url (the chart then creates its own Secret) or
  # existingSecret; the chart refuses to render with neither.
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup
  # step (cmd/facility/main.go, cmd/mcp/main.go) -- never for the runtime
  # pgxpool, which always uses existingSecretKey/DATABASE_URL above,
  # unchanged. `optional: true` below so a secret that predates this key
  # (local dev, an environment whose Terraform hasn't been rolled yet)
  # still starts the pod: the Go binary's own
  # getenv("MIGRATIONS_DATABASE_URL", databaseURL) fallback then makes
  # migrations run against DATABASE_URL, exactly as before this key
  # existed. See ADR-0023 for the PgBouncer/pg_advisory_lock
  # incompatibility this key exists to route migrations around.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

extraEnv: []

# Without a startupProbe, boot work races the liveness probe and loses:
# every injected pod's first outbound TCP dial (Postgres/Kafka) in this
# cluster is reset ~10s after start (Istio native sidecars), and the
# app-side retry (bootretry package) waits at most 1+2+4+8 = 15s between
# its 5 attempts (plus the attempts' own duration) to recover from that. The startupProbe suspends liveness/readiness checks until the
# process actually answers /healthz, so a boot that is retrying its first
# dial is never killed mid-retry. periodSeconds 2 * failureThreshold 30 =
# 60s of startup grace, comfortably past the 15s-plus-attempts retry budget.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  # ADR-0020 §graceful shutdown, ADR 0039: /readyz is a DISTINCT endpoint
  # from /healthz above. It is the drain gate AND a Postgres ping AND a Kafka
  # broker metadata check (cached for a few seconds; it never requires a
  # topic), so a draining pod or an unreachable dependency stops receiving
  # traffic without also failing liveness (which would get the pod SIGKILLed).
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# ADR-0020 §graceful shutdown: readiness flips first, then ONE 10s budget
# drains HTTP and lets the outbox relay finish its pass, then a 5s telemetry
# flush, plus margin for readinessProbe's periodSeconds above to have observed
# the not-ready flip. The chart refuses a value under 20.
terminationGracePeriodSeconds: 30

kafka:
  # MANDATORY (ADR 0039): comma-separated KAFKA_BROKERS; the chart refuses to
  # render without it and there is no default broker. `kafka.enabled` is no
  # longer a switch (warehouse-infra still sets it to true, which keeps
  # rendering); false is refused.
  brokers: ""

nodeSelector: {}
tolerations: []
affinity: {}

# --- analytics data product (ADR-0010) ---
# The "Layout Catalog Growth & Change" report: a separate analytics topic, a
# writer (projector) and a read-only reader (reports), backed by a separate
# analytical database. Disabled by default so existing releases are
# unaffected; set analytics.enabled=true to deploy the two extra processes.
# Requires kafka.brokers on the main deployment too (mandatory anyway), or the
# projector's Kafka topic never receives events to consume.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    # ANALYTICS_CONSUMER_GROUP (ADR 0039): the projector's stable, shared
    # Kafka group id, mandatory and never defaulted by the binary. The value
    # below is the group the projector has always used, so committed offsets
    # survive the move from the constant to the variable. Do NOT rename it
    # on a live system: a new group replays the whole analytics topic.
    consumerGroup: "facility-analytics"
    # HPA min 1 / max 2, see the top-level autoscaling.projector block for
    # the full reasoning (stable shared consumer group, idempotent
    # upserts).
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    # HPA min 1 / max 3, target 70% CPU: stateless read-only REST reader,
    # see the top-level autoscaling.reports block.
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    # Kong exposure of the reports API (reports-route.yaml): host path
    # /api/facility-layout/reports rewritten to /reports. Off by default;
    # warehouse-infra turns it on with the real parentRefs and path.
    route:
      enabled: false
      path: "/api/facility-layout/reports"
      parentRefs:
        - name: ""
          namespace: ""
          sectionName: "http"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# --- MCP server (ADR-0007) ---
# The Model Context Protocol server: a second deployable from the same image
# (`/app/mcp`) exposing this context's read use cases as curated MCP tools
# over Streamable HTTP. It reads the SAME OLTP database as the main
# deployment (database.url / database.existingSecret) and, when analytics is
# enabled, calls the reports Service for the catalog-growth report tool.
# Disabled by default so existing releases are unaffected.
# Deliberately NOT HPA-scalable (no autoscaling.mcp block exists in this
# chart) — see the top-level autoscaling: block's comment for the full
# reasoning: the SDK's StreamableHTTPHandler keeps in-memory, per-process
# MCP session state keyed by Mcp-Session-Id, and this chart's
# mcp-service.yaml has no session affinity, so a second replica could
# receive a mid-session request its own process never created.
# replicaCount therefore stays a plain, manually-set value (ADR-0022).
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure of the MCP server (mcp-route.yaml): host path
  # /api/facility-layout rewritten to /mcp. Off by default; warehouse-infra
  # turns it on with the real parentRefs and path.
  route:
    enabled: false
    path: "/api/facility-layout"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  # Overrides the reports base URL the catalog-growth tool calls. When empty
  # and analytics.enabled=true, defaults to the in-cluster reports Service.
  reportsBaseUrl: ""
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- frontend (REMOTE Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/facility-layout/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/facility-layout-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
