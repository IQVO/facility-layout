{{- if .Values.analytics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "facility-layout.projectorFullname" . }}
  labels:
    {{- include "facility-layout.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-projector
spec:
  {{- if not .Values.autoscaling.projector.enabled }}
  replicas: {{ .Values.analytics.projector.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "facility-layout.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-projector
  template:
    metadata:
      labels:
        {{- include "facility-layout.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-projector
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "facility-layout.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
        - name: projector
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/facility-projector"]
          ports:
            - name: admin
              containerPort: 8091
              protocol: TCP
          env:
            - name: ADMIN_ADDR
              value: {{ .Values.analytics.projector.adminAddr | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            # A stable, shared Kafka group id (ADR 0039): the binary exits at
            # boot without it. The default is the projector's historical
            # group, so committed offsets survive the move from the constant
            # to the variable.
            - name: ANALYTICS_CONSUMER_GROUP
              value: {{ .Values.analytics.projector.consumerGroup | quote }}
            - name: ANALYTICS_MIGRATIONS_PATH
              value: {{ .Values.analytics.migrationsPath | quote }}
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "facility-layout.analyticsSecretName" . }}
                  key: ANALYTICS_DATABASE_URL
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "facility-projector"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # ADR-0020 §graceful shutdown, ADR 0039: distinct from /healthz
            # above so a draining pod (or an unreachable Postgres/Kafka) can
            # flip readiness without failing liveness.
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.analytics.projector.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
