name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 6am UTC, for the mutation job only
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: --timeout=5m

  # Agent-guide sensor (harness-template v3): skills load, references resolve, context budget.
  # BLOCKING: guides are clean (0 errors); keep them that way.
  guide-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/harness/guide_lint.py
      - run: python3 scripts/harness/repo_lint.py
      - run: python3 scripts/harness/test_hook.py
      - run: python3 scripts/harness/test_repo_lint.py


  # Complexity gate as its own named check: cyclomatic (gocyclo, cyclop),
  # cognitive (gocognit), nesting (nestif) and function size (funlen).
  # Thresholds live in .golangci.yml; --enable-only runs just these five
  # so violations surface under their own check name. The report step is
  # informational (step summary, functions over 10 vs the gate of 15).
  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS (code complexity)
  # ============================================================
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: --timeout=5m --enable-only gocyclo,gocognit,cyclop,funlen,nestif
      - name: gocyclo report (functions over 10 — informational, gate is 15)
        if: always()
        run: |
          set -euo pipefail
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          echo "### gocyclo — functions over 10 (informational; the gate is 15)" >> "$GITHUB_STEP_SUMMARY"
          go list -f '{{.Dir}}' ./... | grep -v '/web/' | xargs -r gocyclo -over 10 | awk '!seen[$0]++' | grep -v '/web/' | tee -a "$GITHUB_STEP_SUMMARY" || true

  # ============================================================
  # CLASSIFICATION: UNIT TESTING
  # ============================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build and vet
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      - name: Unit tests with coverage
        run: |
          set -euo pipefail
          go test ./... -race \
            -coverprofile=coverage.out \
            -coverpkg=./internal/domain/...,./internal/application/...

      - name: Coverage gate
        env:
          THRESHOLD: "90"
        run: |
          set -euo pipefail
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "### Coverage: ${COVERAGE}% (gate: ${THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { exit !(c < t) }'; then
            echo "::error::coverage ${COVERAGE}% is below the ${THRESHOLD}% gate"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  # ============================================================
  # CLASSIFICATION: BEHAVIOR TESTING (BDD / Gherkin)
  # ============================================================
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run BDD (godog/Gherkin) acceptance tests
        run: go test ./... -run TestFeatures -v

  # Property-based contract testing: boots the service with its in-memory
  # adapters and generates valid AND invalid requests for every operation
  # in apis/openapi.yaml, asserting response conformance (status codes,
  # content types, response schemas; positive data accepted, negative data
  # rejected). Catches spec/implementation drift the example-based suites
  # (unit, httptest, BDD) cannot see. Same invocation as `make contract`.
  # ============================================================
  # CLASSIFICATION: CONTRACT TESTING (OpenAPI / Schemathesis)
  # ============================================================
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install Schemathesis (pinned)
        run: python3 -m pip install "schemathesis==4.28.0"
      - name: Contract tests (Schemathesis over apis/openapi.yaml)
        run: ./scripts/contract-test.sh

  # The MCP eval gate as its own named check: the eval suites from
  # internal/adapters/inbound/mcp run inside the `test` job too; this job makes the gate
  # visible — and individually gating — on every push and PR.
  # ============================================================
  # CLASSIFICATION: EVALUATION TESTING (MCP evals)
  # ============================================================
  evals-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: MCP evals (E1 schemas, E2 wire conformance, E3 behavioral)
        run: go test ./internal/adapters/inbound/mcp/... -race -run '^TestEval|^TestMCPEvalSuite' -v

  # ============================================================
  # CLASSIFICATION: INTEGRATION TESTING
  # ============================================================
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: facility
          POSTGRES_PASSWORD: facility
          POSTGRES_DB: facility
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Create isolated analytics database
        env:
          PGPASSWORD: facility
        run: psql -h localhost -U facility -d postgres -c 'CREATE DATABASE facility_analytics;'
      - name: Integration tests
        env:
          DATABASE_URL: "postgres://facility:facility@localhost:5432/facility?sslmode=disable"
          ANALYTICS_DATABASE_URL: "postgres://facility:facility@localhost:5432/facility_analytics?sslmode=disable"
        run: |
          set -euo pipefail
          go build -tags=integration ./...
          go vet -tags=integration ./...
          go test -tags=integration ./... -race -count=1

  # ============================================================
  # CLASSIFICATION: TEST QUALITY (MUTATION TESTING, fast subset)
  # ============================================================
  mutation-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (fast, blocking)
        # Subset + workers + timeout-coefficient + efficacy/mutant-coverage
        # thresholds all come from .gremlins.yaml, so this is the exact same
        # command as `make mutation`. Measured ~60s over the whole domain layer
        # (99 mutants) vs 30s for the richest single package (5 mutants), which
        # is why the fast job can afford the full ./internal/domain scope
        # rather than narrowing. See MUTATION.md for the comparison.
        run: gremlins unleash ./internal/domain

  # ============================================================
  # CLASSIFICATION: SECURITY SCANNER (dependency / stdlib CVEs)
  # ============================================================
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Vulnerability scan (dependencies + Go stdlib)
        run: govulncheck ./...

  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (domain layer)
        run: gremlins unleash ./internal/domain --workers 1 --timeout-coefficient 30
      - name: Open or refresh the harness:red issue on a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py mutation "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Close the harness:red issue when the scheduled run recovers
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py mutation --close

  # ============================================================
  # CLASSIFICATION: CONTINUOUS DRIFT (advisory, weekly — never blocks a PR)
  # ============================================================
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Dead code (go tool deadcode, -test so test-only helpers don't false-positive)
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.35.0
          echo "### deadcode" >> "$GITHUB_STEP_SUMMARY"
          deadcode -test ./... | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Unused/stale go.mod entries (go mod tidy -diff)
        run: |
          echo "### go mod tidy -diff" >> "$GITHUB_STEP_SUMMARY"
          go mod tidy -diff | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Unused frontend exports/files/deps (knip)
        working-directory: web
        run: |
          npm ci
          echo "### knip (web/)" >> "$GITHUB_STEP_SUMMARY"
          npx knip --no-exit-code | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Coverage quality — high-coverage functions with a surviving mutant
        run: |
          go test ./internal/domain/... -coverprofile=/tmp/cov.out -covermode=atomic
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          gremlins unleash ./internal/domain --workers 1 --timeout-coefficient 30 > /tmp/gremlins.log 2>&1 || true
          echo "### coverage-quality" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage-quality.py /tmp/cov.out /tmp/gremlins.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open or refresh the harness:red issue on a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py drift "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Close the harness:red issue when the scheduled run recovers
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py drift --close

  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS (API contracts)
  # ============================================================
  api-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Install Spectral (pinned via package-lock.json, npm ci)
        working-directory: .github/tooling/spectral
        run: npm ci
      - name: Lint OpenAPI spec
        run: .github/tooling/spectral/node_modules/.bin/spectral lint apis/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

  # ============================================================
  # CLASSIFICATION: PACKAGING VALIDATION (Helm chart)
  # Runs ONLY for a pull_request targeting main -- validated pre-merge,
  # never on develop pushes/PRs or on push-to-main (already validated).
  # ============================================================
  # ============================================================
  # CLASSIFICATION: DOCS/API DRIFT
  # Guards against the generated "API Reference" docs
  # (docs/docs/api-reference/rest/, produced by docusaurus-plugin-openapi-docs
  # from apis/openapi.yaml) drifting out of sync with the spec they're
  # supposed to mirror. Regenerates them exactly as `gen-api-docs` would and
  # fails the PR if that produces any diff -- i.e. someone changed
  # apis/openapi.yaml (or hand-edited the generated files) without running
  # `npm run gen-api-docs` and committing the result. This repo's
  # gen-api-docs/clean-api-docs scripts are already `docusaurus
  # gen-api-docs all` -- do not pass "all" as an extra positional arg here,
  # that produces "gen-api-docs all all" (harmless no-op today, but sloppy
  # and liable to break on a future docusaurus-plugin-openapi-docs upgrade
  # that stops tolerating a duplicate positional). Note this repo's own
  # `docs/package.json` `build` script already runs `gen-api-docs all &&
  # docusaurus build` -- this job is still needed as an explicit,
  # fast-failing PR gate rather than relying on a full site build to
  # surface drift.
  # ============================================================
  docs-api-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: Regenerate REST API docs from apis/openapi.yaml
        run: npm run clean-api-docs && npm run gen-api-docs
      - name: Fail if generated docs differ from what's committed
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- docs/api-reference/rest; then
            echo "::error::docs/api-reference/rest is out of sync with apis/openapi.yaml." \
                 "Run 'npm run gen-api-docs' inside docs/ and commit the result."
            exit 1
          fi

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          check-latest: true
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: Run chart-testing (lint)
        run: ct lint --charts charts/facility-layout --validate-maintainers=false --check-version-increment=false

  # ============================================================
  # CLASSIFICATION: LINTERS & STATIC ANALYSIS (architecture fitness)
  # ============================================================
  arch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Architecture fitness tests
        run: go test ./internal/architecture/... -v

  # facility-mfe (web/) is a Module Federation remote consumed by the
  # warehouse-console shell; it depends on @warehouse/ui-kit via
  # `file:../../warehouse-ui-kit`, so warehouse-ui-kit is checked out as a
  # SIBLING directory here (matching warehouse-console's own CI shape) so
  # that relative path resolves the same way it does on a contributor's
  # machine. lint + typecheck (tsc -b) + vitest unit/component tests +
  # production build, mirroring the static checks warehouse-console/
  # warehouse-ui-kit already run in their own CI, plus real test coverage
  # (vitest + Testing Library) that no frontend in this fleet had before.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: facility-layout/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: facility-layout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  # Shift-left container scan: builds the image (no push) on every push AND
  # every PR, so a vulnerable base image or dependency is caught before
  # merge, not just at publish time. Blocks on CRITICAL/HIGH with a known
  # fix; findings also land in the repo's Security tab (SARIF) regardless
  # of pass/fail so history is visible even when nothing blocks.
  # ============================================================
  # CLASSIFICATION: SECURITY SCANNER (container image)
  # Runs ONLY for a pull_request targeting main -- validated pre-merge,
  # never on develop pushes/PRs or on push-to-main (already validated).
  # ============================================================
  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: facility-layout:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (SARIF, always uploaded)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: 'facility-layout:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      - name: "Trivy scan (blocking gate: CRITICAL/HIGH with a fix available)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'facility-layout:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================
  # CLASSIFICATION: PUBLISH (Docker image) -- push-to-main only
  # ============================================================
  docker-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, complexity, test, bdd, contract, integration, mutation-fast, vuln, api-lint, arch-test, evals-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (Fulcio/Rekor via GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/iqvo/facility-layout:latest
            ghcr.io/iqvo/facility-layout:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published image (keyless, GitHub OIDC identity)
        run: |
          cosign sign --yes \
            ghcr.io/iqvo/facility-layout@${{ steps.build.outputs.digest }}
      - name: Generate SBOM (SPDX) for the published image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/iqvo/facility-layout@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest the image with its SBOM (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ghcr.io/iqvo/facility-layout@${{ steps.build.outputs.digest }}
      - name: Upload SBOM as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # Cuts a GitHub Release (+ matching git tag + versioned Docker tag) on every
  # merge to main. Runs only after docker-publish actually succeeded, so a
  # release always points at an image that is genuinely live on GHCR.
  # Versioning: simple auto-increment patch (vX.Y.Z -> vX.Y.(Z+1)), starting
  # at v0.1.0 if no tag exists yet. No commit-message parsing.
  # ============================================================
  # CLASSIFICATION: PUBLISH (GitHub release + Helm chart) -- push-to-main only
  # ============================================================
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        run: |
          git fetch origin --tags --force
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            new="v${major}.${minor}.${patch}"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the already-published image with the release version
        run: |
          docker buildx imagetools create \
            -t ghcr.io/iqvo/facility-layout:${{ steps.version.outputs.version }} \
            ghcr.io/iqvo/facility-layout:${{ env.SHORT_SHA }}
      - name: Package and publish the Helm chart for this release
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          CHART_VERSION="${CHART_VERSION#v}"
          mkdir -p /tmp/chart-out
          helm package charts/facility-layout \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            -d /tmp/chart-out
          echo "CHART_TGZ=/tmp/chart-out/facility-layout-${CHART_VERSION}.tgz" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart-out/facility-layout-${CHART_VERSION}.tgz" \
            oci://ghcr.io/iqvo
      - name: Create and push the git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.CHART_TGZ }}
          body: |
            Docker image: `ghcr.io/iqvo/facility-layout:${{ steps.version.outputs.version }}`
            (also tagged `latest` and `${{ env.SHORT_SHA }}`)

            Helm chart: `oci://ghcr.io/iqvo/facility-layout:${{ steps.version.outputs.version }}`
            (also attached below as a `.tgz`)
