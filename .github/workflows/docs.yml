name: Docs
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  # A pull request builds the site (catching broken sidebar ids, links and
  # MDX before they reach main) but never publishes (gap fix D25,
  # 2026-10-12). Before this, a broken docs change was found only after the
  # release merged to main.
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Publishing runs share one "pages" group (queued, never cancelled); a PR
# build gets its own per-ref group so it can neither cancel nor be dropped
# behind a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      # Only main publishes: a pull request builds the site but never
      # uploads a Pages artifact.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/build

  deploy:
    # Requires Settings > Pages > Source = "GitHub Actions" (enabled once per repo).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
